; ATLAS-M carrier firmware for Board A (ESP32-S3-WROOM-1-N8, no PSRAM), ESP-IDF 5.x via PlatformIO.
;   pio run                 build
;   pio run -t upload       flash over the native USB-C (hold BOOT, tap RESET the first time)
[env:board_a]
platform = espressif32@6.9.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags = -Wall -Wno-format
