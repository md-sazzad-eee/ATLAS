# =====================================================================
# ATLAS — single source of truth for shared design parameters
# =====================================================================
# Edit ONLY this file. Then run:
#     python3 00_requirements/sync_params.py
# which writes atlas_params.json (read by MATLAB, FreeCAD and COMSOL
# scripts, which have no native YAML reader).
#
# Units: SI unless the key name says otherwise (_mm, _deg, _mAh, _pct).
# Every value here is a PROPOSED STARTING TARGET, not a measured value.
# Replace with measurements as hardware arrives and log the change in
# 00_requirements/CHANGELOG.md.
# =====================================================================

meta:
  version: 0.1.3
  status: phase-1 draft

environment:
  floor: indoor, flat, sealed concrete / vinyl
  rolling_resistance_coeff: 0.03     # conservative for hard rubber wheels on floor
  max_floor_slope_deg: 3.0           # small thresholds, cable covers
  gravity: 9.81

# ---------------------------------------------------------------------
# ATLAS-S  (Scout S1 and Research agent S2 share one chassis + PCB)
# ---------------------------------------------------------------------
agent:
  body_length_mm: 150
  body_width_mm: 130
  body_height_mm: 90
  ground_clearance_mm: 12
  mass_loaded_kg: 1.20               # chassis + battery + PCB + sensor module
  wheel_diameter_mm: 65
  wheel_width_mm: 26
  track_width_mm: 100                # wheel centre to wheel centre
  wheel_axle_from_front_mm: 95       # caster at rear
  driven_wheels: 2
  max_speed_mps: 0.20
  docking_speed_mps: 0.05
  design_accel_mps2: 0.50
  gearbox_efficiency: 0.70
  torque_safety_factor: 2.0
  encoder_cpr_motor_shaft: 12        # magnetic hall encoder, counts per motor rev (x4 decoding not included)
  battery:
    chemistry: Li-ion
    series_cells: 2
    nominal_voltage: 7.4
    max_voltage: 8.4
    min_voltage: 6.0
    capacity_mAh: 2500               # 2 x 18650
    usable_fraction: 0.80
    mass_kg: 0.10
  electronics_power_W:               # continuous average
    mcu_and_radio: 0.9               # ESP32-class MCU with Wi-Fi active
    sensors_scout: 2.9               # ToF 0.3 W + Pi Zero 2 W/Camera Module 3 vision ~2.3 W, via 90 % buck (rev 0.1.3)
    sensors_research: 0.8            # measurement module
    motor_drivers_idle: 0.1
  runtime_target_min: 30
  duty_cycle_driving: 0.50           # fraction of mission spent driving
  camera_module:                     # Scout only (rev 0.1.3): ESP32-S3 keeps control, Linux does vision
    host: Raspberry Pi Zero 2 W
    camera: Raspberry Pi Camera Module 3 (CSI)
    link_to_mcu: UART (ESP32 IO48 TX / IO3 RX), 921600 baud
    supply: 5 V rail, high-side switched by ESP32 PI_PWR_EN (Q6)
    power_avg_W: 2.3                 # idle ~0.6 W + capture/encode ~0.75 W + tag detection ~1 W
    power_peak_W: 7.0                # boot / all cores; 5 V buck sized 3 A
    boot_time_s: 20
    roles: [AprilTag dock alignment, workstation marker reading, inspection images]

# ---------------------------------------------------------------------
# ATLAS-M  (main carrier)
# ---------------------------------------------------------------------
carrier:
  body_length_mm: 450
  body_width_mm: 350
  body_height_mm: 240
  ground_clearance_mm: 30
  mass_empty_kg: 8.5
  agents_carried: 2
  wheel_diameter_mm: 100
  driven_wheels: 4                   # skid-steer, left pair / right pair
  track_width_mm: 400                # wheels OUTBOARD of the body: 300 collided with the rear bays (rev 0.1.1)
  wheel_width_mm: 40
  wheelbase_mm: 300
  max_speed_mps: 0.40
  design_accel_mps2: 0.40
  gearbox_efficiency: 0.70
  torque_safety_factor: 2.0
  lateral_friction_coeff: 0.5        # tyre side-slip friction, governs skid-steer turning torque
  battery:
    chemistry: LiFePO4
    series_cells: 4
    nominal_voltage: 12.8
    max_voltage: 14.6
    min_voltage: 10.0
    capacity_mAh: 10000
    usable_fraction: 0.85
    mass_kg: 1.3
  electronics_power_W:
    sbc: 12.0                        # Linux SBC running ROS 2
    mcu: 0.8
    lidar: 2.5
    dock_actuators_avg: 0.5
  agent_charge_current_A: 1.0        # per agent, CC phase
  runtime_target_min: 60
  duty_cycle_driving: 0.40

# ---------------------------------------------------------------------
# Docking interface (defines the fleet — model this first)
# ---------------------------------------------------------------------
dock:
  bays: 2
  bay_pitch_mm: 170                  # centre-to-centre, side by side, rear-loading
  side_clearance_mm: 1.5             # per side between agent and guide (nominal)
  clearance_test_set_mm: [0.5, 1.0, 1.5, 2.0, 3.0]
  guide_length_mm: 120               # funnel + guide must cover the 150 mm agent (rev 0.1.1)
  guide_height_mm: 35
  guide_thickness_mm: 6
  funnel_flare_mm: 8                 # extra opening per side at the mouth
  funnel_length_mm: 35
  deck_height_mm: 25                 # above floor; agent climbs a fixed ramp
  ramp_angle_deg: 12.0
  front_stop_thickness_mm: 8
  front_stop_height_mm: 55           # carries contact block + seated sensor
  contact_height_above_deck_mm: 37   # pad centre on agent front face
  latch_height_above_deck_mm: 32     # latch pin axis (front catch-tab latch, rev 0.1.2)
  latch_housing_depth_mm: 25         # latch housing ahead of the front stop
  carrier_front_reserve_mm: 140      # batteries, SBC, MCU ahead of the bays
  latch:
    type: solenoid-driven cross pin through agent front catch tab, spring-locked, fail-locked
    # rev 0.1.2: side latch moved to the front - the bay-2 solenoid hit the chassis wall and
    # the bay-1 solenoid sat in the 25 mm gap between bays (found by build_atlas_cad.py)
    pin_diameter_mm: 6.0
    hole_clearance_mm: 0.6           # diametral
    pin_travel_mm: 10                # 8 was short: cross pin must clear the 5 mm tab + clearances (CAD check, rev 0.1.2)
    hold_force_N: 40
  contacts:
    type: spring-loaded pogo pins on carrier, flat pads on agent
    count: 4                         # VBAT_CHG, GND, UART_TX/RX half-duplex, ID
    pitch_mm: 8.0
    pin_tip_diameter_mm: 2.0
    pad_size_mm: [5.0, 5.0]
    contact_resistance_mohm: 30      # per contact, worst-case end-of-life
    max_current_A: 2.0
  sensors:
    seated: optical interrupter at front stop
    latch_position: hall sensor on latch pin
  retry_limit: 3
  backoff_distance_mm: 60

# ---------------------------------------------------------------------
# Mission software defaults
# ---------------------------------------------------------------------
mission:
  cost_weights: {distance: 1.0, time: 0.5, energy: 2.0, risk: 3.0}
  battery_return_reserve_pct: 25
  task_timeout_factor: 2.0           # timeout = factor x expected duration
  heartbeat_period_s: 0.5
  heartbeat_timeout_s: 2.0           # agent stops if no heartbeat this long
